# Static server for BlueprintDeck's dist/ output (see Dockerfile).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for the text payloads Vite emits (text/html is always gzipped).
    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Security headers for all responses. nginx add_header inheritance: any
    # location that declares its own add_header must re-declare these.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Healthcheck endpoint for the image's HEALTHCHECK.
    location = /healthz {
        default_type text/plain;
        access_log off;
        return 200 "ok\n";
    }

    # Hashed build assets: content-hashed names, cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Re-declare inherited headers (location-level add_header cancels them).
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;

        try_files $uri =404;
    }

    # Static files with a fallback to the app (state lives in the URL hash).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
