---
# BlueprintDeck CI — runs the repository's own quality gates on every PR and
# push to main. The publish workflow (docker-publish.yml) reuses this file via
# workflow_call, so tests always gate published images.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.run_id is unique per run, so the standalone CI run and the run
  # invoked (workflow_call) by docker-publish.yml on the same push to main
  # never collide in the concurrency group and cancel each other.
  group: ci-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / lint / build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Production build
        run: npm run build

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    # contents: read is the maximum this job needs. IMPORTANT: do not request
    # more (e.g. security-events: write) — when ci.yml is reused by
    # docker-publish.yml (whose workflow-level grant is contents: read), a
    # callee job cannot exceed the caller's permissions and GitHub rejects the
    # whole publish run at startup (startup_failure with zero jobs).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for secrets
        # gitleaks v3 uses GITHUB_TOKEN only for PR comments and optional
        # SARIF artifact upload; neither requires security-events: write.
        # Findings fail the job via the action's exit code.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      - name: YAML lint (workflows + compose)
        # `truthy` is disabled: the bare `on:` key is required GitHub Actions
        # syntax and a known yamllint false positive.
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 160}, comments: {min-spaces-from-content: 1}, truthy: disable}}" \
            .github/workflows/*.yml docker-compose.yml

      - name: Validate compose file
        run: |
          docker compose config --quiet

      - name: Download actionlint
        run: |
          curl -fsSL --retry 3 -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -version

      - name: Run actionlint
        run: /tmp/actionlint -color

      - name: Lint Dockerfile
        # DL3025: shell-form HEALTHCHECK CMD is deliberate (the `|| exit 1`
        # suffix reports failure to Docker; JSON form cannot express that).
        run: |
          curl -fsSL --retry 3 -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          /tmp/hadolint --version
          /tmp/hadolint --ignore DL3025 Dockerfile

      - name: Validate nginx config
        # docker/nginx.conf is a server block, included by the image's main
        # config from /etc/nginx/conf.d/. Mount it at exactly that path and let
        # the pinned image's own nginx.conf (events/http + the conf.d include)
        # validate the real deployment shape. The mount is read-only so the
        # entrypoint's listen-on-ipv6 tweak cannot mutate the checked-out file.
        run: |
          docker run --rm \
            -v "$PWD/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Check action pins
        run: |
          bad=0
          for f in .github/workflows/*.yml; do
            # Every `uses:` must be pinned to a full 40-char commit SHA.
            while IFS= read -r line; do
              ref=$(printf '%s' "$line" | sed -E 's|^.*@||; s|[[:space:]].*||')
              if ! printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$'; then
                echo "::error file=$f::unpinned action ref: $line"
                bad=1
              fi
            done < <(grep -oE 'uses: [^ ]+@[^ ]+' "$f")
          done
          exit $bad
