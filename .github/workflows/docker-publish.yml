---
# Publish the BlueprintDeck image to GHCR on main and version tags.
#
# Image:
#   ghcr.io/<owner>/blueprintdeck  (nginx + static Vite output)
#
# Tagging (via docker/metadata-action):
#   main push   -> latest, sha-<short>
#   v* tag push -> <semver>, <major>.<minor>, sha-<short>
#
# The full CI workflow is re-executed here (workflow_call into ci.yml) so
# published images are always gated by the same tests as PRs.
#
# Deployment: the public host pulls updated images automatically via Watchtower
# (no deploy step in this workflow).
name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-tests:
    uses: ./.github/workflows/ci.yml
    # Re-runs the whole CI workflow (test + workflow-lint jobs); this keeps
    # published images gated by the full gate set without duplicating job
    # definitions.
    permissions:
      contents: read

  build:
    name: Build & push image
    runs-on: ubuntu-24.04
    needs: ci-tests
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/blueprintdeck
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/blueprintdeck
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
